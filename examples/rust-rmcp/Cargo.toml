[package]
name = "epode-rust-rmcp-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agent-feedback = { path = "../../sdk/rust", features = ["rmcp"] }
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
