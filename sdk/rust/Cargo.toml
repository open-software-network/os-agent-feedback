[package]
name = "agent-feedback"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Epode customer-enrichment and agent-feedback SDK for Rust products"
license = "MIT"
repository = "https://github.com/open-software-network/os-epode"
homepage = "https://github.com/open-software-network/os-epode/tree/main/sdk/rust"
documentation = "https://docs.rs/agent-feedback"
readme = "README.md"
keywords = ["agent", "feedback", "middleware", "axum"]
categories = ["web-programming::http-server"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md"]

[features]
default = []
rmcp = ["dep:rmcp"]

[dependencies]
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
http = "1"
http-body = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.1.0", optional = true, default-features = false, features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tower = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rmcp = { version = "=3.1.0", default-features = false, features = ["client", "server", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
