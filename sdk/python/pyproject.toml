[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-feedback"
version = "0.1.0"
description = "Protocol-first Agent Feedback middleware for Python web products."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Agent Feedback" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Framework :: Django",
]

[project.urls]
Homepage = "https://github.com/open-software-network/os-agent-feedback/tree/main/sdk/python"
Repository = "https://github.com/open-software-network/os-agent-feedback.git"
Issues = "https://github.com/open-software-network/os-agent-feedback/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_feedback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
