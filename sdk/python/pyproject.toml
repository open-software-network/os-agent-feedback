[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-feedback"
version = "0.2.0"
description = "Protocol-first Agent Feedback middleware for Python web products."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Agent Feedback" }]
keywords = ["agent", "feedback", "middleware", "observability"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Framework :: Django",
]

[project.urls]
Homepage = "https://github.com/open-software-network/os-epode/tree/main/sdk/python"
Repository = "https://github.com/open-software-network/os-epode.git"
Issues = "https://github.com/open-software-network/os-epode/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_feedback"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/agent_feedback",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
