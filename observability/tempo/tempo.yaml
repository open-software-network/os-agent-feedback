# Single-binary Tempo with local storage, sized for one Railway service with
# a volume at /tempo. Traces arrive over OTLP gRPC from the collector.

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush in-memory traces to storage frequently so a restart loses little.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 720h # 30 days

storage:
  trace:
    backend: local
    wal:
      path: /tempo/wal
    local:
      path: /tempo/traces

usage_report:
  reporting_enabled: false
