# Prometheus receives all application metrics through the collector's OTLP
# exporter (native OTLP ingest, enabled by flag in the Dockerfile), so the
# only scrape job here is Prometheus itself.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Application metrics arrive over OTLP. Promote the bounded resource fields
# used by production alert queries onto every series; Prometheus otherwise
# keeps deployment.environment.name only on target_info.
otlp:
  promote_resource_attributes:
    - service.version
    - deployment.environment.name

storage:
  tsdb:
    # The collector batches exports and multiple application instances can
    # arrive slightly out of order during a rolling deployment.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
