apiVersion: 1

contactPoints:
  - orgId: 1
    name: Epode production Slack
    receivers:
      - uid: epode_production_slack
        type: slack
        disableResolveMessage: false
        settings:
          url: $EPODE_ALERT_SLACK_WEBHOOK_URL
          title: Epode production alert

groups:
  - orgId: 1
    name: Production SLOs
    folder: Epode production
    interval: 1m
    rules:
      - uid: epode_api_telemetry_missing
        title: API production telemetry is missing
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: absent_over_time(http_server_request_duration_seconds_count{job="epode-api",deployment_environment_name="production"}[10m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: The production API or its OTLP pipeline has emitted no request metrics for ten minutes.
          runbook_url: https://github.com/open-software-network/os-epode/blob/main/docs/agents/deployment-runbook.md#alert-response
        labels:
          environment: production
          service: epode-api
          severity: critical
        notification_settings:
          receiver: Epode production Slack

      - uid: epode_web_telemetry_missing
        title: Web production telemetry is missing
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: absent_over_time(http_server_request_duration_seconds_count{job="epode-web",deployment_environment_name="production"}[10m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: The production web service or its OTLP pipeline has emitted no request metrics for ten minutes.
          runbook_url: https://github.com/open-software-network/os-epode/blob/main/docs/agents/deployment-runbook.md#alert-response
        labels:
          environment: production
          service: epode-web
          severity: critical
        notification_settings:
          receiver: Epode production Slack

      - uid: epode_production_5xx_rate
        title: Production HTTP 5xx rate is high
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (
                  sum by (job) (rate(http_server_request_duration_seconds_count{job=~"epode-api|epode-web",deployment_environment_name="production",http_response_status_code=~"5.."}[5m]))
                  /
                  clamp_min(sum by (job) (rate(http_server_request_duration_seconds_count{job=~"epode-api|epode-web",deployment_environment_name="production"}[5m])), 0.001)
                )
                and on (job)
                sum by (job) (increase(http_server_request_duration_seconds_count{job=~"epode-api|epode-web",deployment_environment_name="production",http_response_status_code=~"5.."}[5m])) >= 5
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: At least five production requests failed and the five-minute 5xx rate exceeded five percent.
          runbook_url: https://github.com/open-software-network/os-epode/blob/main/docs/agents/deployment-runbook.md#alert-response
        labels:
          environment: production
          severity: critical
        notification_settings:
          receiver: Epode production Slack

      - uid: epode_production_p95_latency
        title: Production HTTP p95 latency is high
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                histogram_quantile(
                  0.95,
                  sum by (job, le) (rate(http_server_request_duration_seconds_bucket{job=~"epode-api|epode-web",deployment_environment_name="production"}[5m]))
                )
                and on (job)
                sum by (job) (increase(http_server_request_duration_seconds_count{job=~"epode-api|epode-web",deployment_environment_name="production"}[5m])) >= 20
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Production p95 request latency exceeded two seconds for five minutes with enough traffic to evaluate.
          runbook_url: https://github.com/open-software-network/os-epode/blob/main/docs/agents/deployment-runbook.md#alert-response
        labels:
          environment: production
          severity: warning
        notification_settings:
          receiver: Epode production Slack
