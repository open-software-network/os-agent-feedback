# Single-binary Loki with filesystem storage, sized for one Railway service
# with a volume at /loki. Logs arrive exclusively through Loki's OTLP
# endpoint (/otlp/v1/logs) from the collector.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP log attributes land in structured metadata; required for the
  # collector's OTLP payload to be queryable by attribute.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 720h # 30 days; enforced by the compactor below

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
