packages:
  - "."
  - "sdk/node"
  - "web"

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
# MCP 2.0.0 was published inside the seven-day window. These exact exemptions
# become no-ops after 2026-08-03 and should be deleted then.
minimumReleaseAgeExclude:
  - "@modelcontextprotocol/core@2.0.0"
  - "@modelcontextprotocol/server@2.0.0"
# No dependency build scripts are approved. A true entry requires a
# demonstrated failing command.
allowBuilds:
  "@central-icons-react/round-outlined-radius-3-stroke-2": false
  "@scarf/scarf": false
  keytar: false
  # OTLP exporter dependency; its postinstall is a legacy browser-field check
  # that the Node SDK does not need.
  protobufjs: false
  puppeteer: false
  sharp: false
