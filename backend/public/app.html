<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Feedback Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260729-readkeys">
  <script src="/static/app.js?v=20260729-consent-modes" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">AGENT FEEDBACK</a>
      <div id="product-scope" class="product-scope"></div>
      <nav>
        <p>FEEDBACK</p>
        <button data-view="feedback"><span>Feedback</span><b data-nav-count="feedback">0</b></button>
        <button data-view="insights">Insights</button>
        <p>PRODUCT USE</p>
        <button data-view="interactions"><span>Interactions</span><b data-nav-count="interactions">0</b></button>
        <button data-view="sessions"><span>Sessions</span><b data-nav-count="sessions">0</b></button>
        <p>CONFIGURATION</p>
        <button data-view="setup" data-editor-only>Setup</button>
        <button data-view="policy" data-editor-only>Collection policy</button>
        <button data-view="team">Team</button>
      </nav>
      <div id="account" class="account"></div>
      <button id="signout" class="link-button">Sign out</button>
    </aside>
    <main class="content">
      <div id="notice" class="notice notice-info" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div id="page" aria-live="polite"><p>Loading…</p></div>
    </main>
  </div>
</body>
</html>
