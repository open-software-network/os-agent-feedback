<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Feedback Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">AGENT FEEDBACK</a>
      <div id="product-scope" class="product-scope"></div>
      <nav>
        <p>FEEDBACK</p>
        <button data-view="feedback">Feedback</button>
        <button data-view="insights">Insights</button>
        <p>PRODUCT USE</p>
        <button data-view="interactions">Interactions</button>
        <button data-view="sessions">Sessions</button>
        <p>CONFIGURATION</p>
        <button data-view="setup">Setup</button>
        <button data-view="policy">Collection policy</button>
      </nav>
      <div id="account" class="account"></div>
      <button id="signout" class="link-button">Sign out</button>
    </aside>
    <main class="content">
      <div id="notice" class="notice" hidden></div>
      <div id="page" aria-live="polite"><p>Loading…</p></div>
    </main>
  </div>
</body>
</html>
