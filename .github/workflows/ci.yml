name: CI

# PR checks are local by default (gh-signoff; see docs/agents/local-ci-signoff.md):
# each heavy job is replaced by a required signoff/* commit status posted by
# `make local-ci` on the developer's machine. Add the matching run-*-ci label
# to a PR to force the hosted job, and every job still runs on push to main.
# The cheap Workflow lint job stays hosted on PRs because it guards this
# file and the signoff scripts themselves.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      node: ${{ steps.filter.outputs.node }}
      sdk-node: ${{ steps.filter.outputs.sdk-node }}
      sdk-packages: ${{ steps.filter.outputs.sdk-packages }}
      examples: ${{ steps.filter.outputs.examples }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            backend:
              - "backend/**"
              - "Makefile"
              - ".github/workflows/ci.yml"
            node:
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "biome.json"
              - "Makefile"
              - "tests/**"
              - "backend/**"
              - "sdk/**"
              - "protocol/**"
              - "docs/**"
              - "scripts/hosted-artifact-ledger.json"
              - "scripts/verify-image-artifact-ledger.sh"
              - "scripts/verify-public-integration-surface.sh"
              - ".github/workflows/ci.yml"
            sdk-node:
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "biome.json"
              - "Makefile"
              - "sdk/node/**"
              - "tests/customer-context-mcp-e2e.mjs"
              - ".github/workflows/ci.yml"
            sdk-packages:
              - "sdk/**"
              - "scripts/sdk-release-readiness.sh"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/sdk-release.yml"
            examples:
              - "examples/**"
              - "backend/public/agent-feedback-node-*.tgz"
              - "sdk/node/**"
              - "examples/node-express/**"
              - "examples/node-mcp/**"
              - "examples/static-docs-edge/**"
              - ".dockerignore"
              - ".github/workflows/build-node-examples.yml"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "biome.json"
              - "Makefile"
              - "backend/openapi.json"
              - ".github/workflows/ci.yml"
            docs:
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "Makefile"
              - "docs/**"
              - "sdk/**"
              - "protocol/**"
              - "backend/public/app.js"
              - "tests/docs-contract.test.mjs"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/workflows/**"
              - "scripts/railway-deploy-image.sh"
              - "scripts/verify-migration-ledger.sh"
              - "scripts/verify-public-integration-surface.sh"
              - "scripts/local-ci.sh"
              - "scripts/signoff-*.sh"

  backend:
    name: Backend
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-backend-ci'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_feedback
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_feedback"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agent_feedback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo
            backend/target
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-
      - name: Check formatting
        run: make backend-fmt-check
      - name: Run Clippy
        run: make backend-clippy
      - name: Run backend tests
        run: make backend-test
      - name: Run live PostgreSQL isolation and migration tests
        run: cd backend && cargo test --locked -- --ignored --test-threads=1

  customer-enrichment-e2e:
    name: Customer enrichment journey
    needs: changes
    if: >-
      (needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.sdk-node == 'true' ||
      needs.changes.outputs.examples == 'true') &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e-ci'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_feedback
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_feedback"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agent_feedback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95"
      - name: Install locked SDK dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the disposable retail and advertising examples
        run: |
          npm --prefix examples/mvp-retail-express install --ignore-scripts --no-audit --no-fund
          npm --prefix examples/mvp-anonymous-express install --ignore-scripts --no-audit --no-fund
      - name: Run customer personalization, advertising, and MCP journeys
        run: |
          pnpm test:customer-enrichment-e2e
          pnpm test:customer-context-mcp-e2e

  node:
    name: Node and Biome
    needs: changes
    if: >-
      needs.changes.outputs.node == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-node-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: make node-install
      - name: Run Biome
        run: make biome-check
      - name: Run Node tests
        run: make node-test

  sdk-node:
    name: Node SDK
    needs: changes
    if: >-
      needs.changes.outputs.sdk-node == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-sdk-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: make node-install
      - name: Test Node SDK
        run: make sdk-node-test

  sdk-packages:
    name: SDK package artifacts
    needs: changes
    if: >-
      needs.changes.outputs.sdk-packages == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-sdk-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.x"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, validate, and install SDK artifacts
        run: SDK_ARTIFACT_DIR=.artifacts/sdk-release bash scripts/sdk-release-readiness.sh
      - name: Upload SDK release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-release-candidate
          path: .artifacts/sdk-release
          if-no-files-found: error

  examples:
    name: Product examples
    needs: changes
    if: >-
      needs.changes.outputs.examples == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-examples-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            examples/customer-context-scenarios/package-lock.json
            examples/node-express/package-lock.json
            examples/node-mcp/package-lock.json
            examples/static-docs-edge/package-lock.json
      - name: Install locked production dependencies
        run: |
          npm ci --prefix examples/customer-context-scenarios --omit=dev --ignore-scripts
          npm ci --prefix examples/node-express --omit=dev --ignore-scripts
          npm ci --prefix examples/node-mcp --omit=dev --ignore-scripts
          npm install \
            --prefix examples/static-docs-edge \
            --ignore-scripts \
            --no-save \
            --package-lock=false \
            wrangler@4.118.0 \
            "$GITHUB_WORKSPACE/backend/public/agent-feedback-node-0.4.0.tgz"
      - name: Check entry points
        run: |
          node --check examples/customer-context-scenarios/mcp-server.js
          node --check examples/node-express/src/index.js
          node --check examples/node-mcp/src/index.js
      - name: Test the Shopwise MCP transport
        run: npm test --prefix examples/customer-context-scenarios
      - name: Validate static edge worker bundle
        run: npm run --prefix examples/static-docs-edge check
      - name: Smoke-test health endpoints
        env:
          AGENT_FEEDBACK_KEY: af_live_11111111111111111111111111111111_22222222222222222222222222222222_abcdefghijklmnopqrstuvwxyz
          AGENT_FEEDBACK_URL: http://127.0.0.1:9
        run: |
          set -euo pipefail
          PORT=3100 node examples/node-express/src/index.js > /tmp/epode-example-http.log 2>&1 &
          http_pid=$!
          PORT=3102 node examples/node-mcp/src/index.js > /tmp/epode-example-mcp.log 2>&1 &
          mcp_pid=$!
          cleanup() { kill "$http_pid" "$mcp_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for port in 3100 3102; do
            ready=false
            for _ in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:${port}/health" > /dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              cat /tmp/epode-example-http.log /tmp/epode-example-mcp.log
              exit 1
            fi
          done

  web:
    name: Web
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-web-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: make node-install
      - name: Check generated API types
        run: make web-types-check
      - name: Check web formatting and linting
        run: make web-check
      - name: Typecheck web
        run: make web-typecheck
      - name: Test web
        run: make web-test
      - name: Build web
        run: make web-build
      - name: Run dashboard release browser check
        run: make web-release-e2e

  docs:
    name: Documentation
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-docs-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: make node-install
      - name: Validate documentation
        run: make docs-validate
      - name: Audit documentation accessibility
        run: make docs-a11y

  # Single required status check. Every job above is path-filtered, so a PR that
  # touches only docs or briefs skips all of them; branch protection should name
  # this job alone rather than five names that must be edited whenever a job is
  # added or renamed. `always()` makes it run even when a dependency is skipped
  # or failed — without it, one skipped dependency would skip the gate too.
  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.10
      ACTIONLINT_SHA256: f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        run: ./actionlint -color
      - name: Lint deployment and public-surface helpers
        run: >-
          shellcheck
          scripts/railway-deploy-image.sh
          scripts/verify-image-artifact-ledger.sh
          scripts/verify-public-integration-surface.sh
      - name: Lint local signoff helpers
        run: >-
          shellcheck
          scripts/local-ci.sh
          scripts/signoff-common.sh
          scripts/signoff-backend.sh
          scripts/signoff-e2e.sh
          scripts/signoff-node.sh
          scripts/signoff-sdk.sh
          scripts/signoff-examples.sh
          scripts/signoff-web.sh
          scripts/signoff-docs.sh

  ci-ok:
    name: CI
    needs: [backend, node, sdk-node, sdk-packages, examples, web, docs, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::A required CI job reported '$result'."
              exit 1
            fi
          done
          echo "All applicable CI jobs succeeded or were skipped."
