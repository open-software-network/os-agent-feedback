name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-landing.yml"

permissions:
  contents: read

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: false

env:
  RAILWAY_CLI_VERSION: 5.30.1

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Upload landing page
        run: |
          set -euo pipefail
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "::error::The production environment secret RAILWAY_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "$RAILWAY_PROJECT_ID" ]]; then
            echo "::error::The RAILWAY_PROJECT_ID variable is not configured."
            exit 1
          fi

          railway up ./landing-page \
            --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service epode \
            --ci \
            --message "Deploy landing page from $GITHUB_SHA"

      - name: Summarize deployment
        run: |
          {
            echo "### Railway landing-page deployment"
            echo "- **Service:** \`epode\`"
            echo "- **Environment:** \`production\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
