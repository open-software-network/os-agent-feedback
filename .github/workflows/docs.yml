name: Docs quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "sdk/**"
      - "protocol/**"
      - "backend/public/app.js"
      - "tests/docs-contract.test.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sdk/**"
      - "protocol/**"
      - "backend/public/app.js"
      - "tests/docs-contract.test.mjs"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:validate
      - run: npm run docs:a11y
      - run: node --test tests/docs-contract.test.mjs
