name: Build API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/open-software-network/os-epode-api
  RAILWAY_CLI_VERSION: 5.30.1

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE }}:staging
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=os-epode-api
          cache-to: type=gha,mode=max,scope=os-epode-api

      - name: Summarize image
        run: |
          {
            echo "### API image built"
            echo "- **SHA tag:** \`${{ env.IMAGE }}:${{ steps.meta.outputs.sha_short }}\`"
            echo "- **Staging tag:** \`${{ env.IMAGE }}:staging\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      IMAGE_REF: ghcr.io/open-software-network/os-epode-api:${{ needs.build.outputs.sha_short }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Pin SHA image and wait for staging
        run: |
          set -euo pipefail
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "::error::The staging environment secret RAILWAY_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "$RAILWAY_PROJECT_ID" ]]; then
            echo "::error::The RAILWAY_PROJECT_ID variable is not configured."
            exit 1
          fi

          previous_id=$(railway deployment list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment staging \
            --service epode-api \
            --limit 1 \
            --json | jq -r '.[0].id // empty')
          current_image=$(railway service list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment staging \
            --json \
            | jq -r '.[] | select(.name == "epode-api") | .source.image // empty')

          if [[ "$current_image" == "$IMAGE_REF" ]]; then
            railway redeploy \
              --project "$RAILWAY_PROJECT_ID" \
              --environment staging \
              --service epode-api \
              --from-source \
              --yes \
              --json
          else
            # Railway CLI 5.30 reads non-TTY stdin as JSON configuration.
            # Allocate a PTY so the explicit --service-config flags are used.
            script --quiet --return --command \
              "railway environment edit --project \"$RAILWAY_PROJECT_ID\" --environment staging --service-config epode-api source.image \"$IMAGE_REF\" --message \"Deploy $GITHUB_SHA to staging\" --json" \
              /dev/null
          fi

          for _ in $(seq 1 60); do
            deployment=$(railway deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment staging \
              --service epode-api \
              --limit 1 \
              --json)
            deployment_id=$(jq -r '.[0].id // empty' <<< "$deployment")
            status=$(jq -r '.[0].status // empty' <<< "$deployment")

            if [[ -z "$deployment_id" || "$deployment_id" == "$previous_id" ]]; then
              sleep 10
              continue
            fi

            case "$status" in
              SUCCESS)
                echo "Staging deployment $deployment_id succeeded."
                exit 0
                ;;
              FAILED|CRASHED|REMOVED)
                echo "::error::Staging deployment $deployment_id finished with status $status."
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "::error::Timed out waiting for the staging deployment."
          exit 1

      - name: Summarize staging deployment
        run: |
          {
            echo "### Railway staging deployment"
            echo "- **Service:** \`epode-api\`"
            echo "- **Environment:** \`staging\`"
            echo "- **Image:** \`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
