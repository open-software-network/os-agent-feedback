name: Verify or apply additive database expansion

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify or retry-safely apply one additive migration.
        required: true
        default: verify-canary
        type: choice
        options:
          - verify-canary
          - apply-canary
          - verify-production
          - apply-production
      target_sha:
        description: Protected-main commit carrying the migration and current CI signoffs.
        required: true
        type: string
      migration_sha:
        description: Optional protected-main commit that originally added the migration; defaults to target_sha.
        required: false
        type: string
      verification_state:
        description: For verification, require the database immediately before or at the migration.
        required: true
        default: before
        type: choice
        options:
          - before
          - after
      backup_reference:
        description: Apply-production only. Opaque provider backup or snapshot identifier.
        required: false
        type: string
      backup_verified_at:
        description: Apply-production only. RFC3339 verification time, no more than 24 hours ago.
        required: false
        type: string
      backup_restore_test_reference:
        description: Apply-production only. Opaque identifier for a successful restore test.
        required: false
        type: string
      confirm_production:
        description: Required acknowledgement for apply-production.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: epode-release-mutation
  cancel-in-progress: false

env:
  RAILWAY_CLI_VERSION: 5.30.1
  SQLX_CLI_VERSION: 0.8.6

jobs:
  plan:
    name: Derive and review additive migration
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.review.outputs.target_sha }}
      migration_path: ${{ steps.review.outputs.migration_path }}
      migration_sha256: ${{ steps.review.outputs.migration_sha256 }}
      migration_version: ${{ steps.review.outputs.migration_version }}
      expected_previous_version: ${{ steps.review.outputs.expected_previous_version }}
    env:
      OPERATION: ${{ inputs.operation }}
      TARGET_SHA: ${{ inputs.target_sha }}
      MIGRATION_SHA: ${{ inputs.migration_sha }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      BACKUP_VERIFIED_AT: ${{ inputs.backup_verified_at }}
      BACKUP_RESTORE_TEST_REFERENCE: ${{ inputs.backup_restore_test_reference }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Require protected main and local CI signoff
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "::error::target_sha must be the exact checked-out 40-character commit."
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$TARGET_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::The migration commit is not on protected $DEFAULT_BRANCH."
            exit 1
          fi
          scripts/verify-ci-signoffs.sh "$TARGET_SHA"

      - name: Derive the single added migration
        id: review
        run: |
          set -euo pipefail
          migration_sha="${MIGRATION_SHA:-$TARGET_SHA}"
          if [[ ! "$migration_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::migration_sha must be an exact 40-character commit when provided."
            exit 1
          fi
          git fetch --no-tags origin "$migration_sha"
          if ! git merge-base --is-ancestor "$migration_sha" "$TARGET_SHA"; then
            echo "::error::migration_sha must be an ancestor of the signed target_sha."
            exit 1
          fi
          mapfile -t migration_changes < <(
            git diff --name-status "${migration_sha}^1" "$migration_sha" -- backend/migrations
          )
          if [[ "${#migration_changes[@]}" -ne 1 ]]; then
            echo "::error::migration_sha must add exactly one migration and may not modify earlier migrations."
            exit 1
          fi
          read -r change migration_path extra <<< "${migration_changes[0]}"
          if [[ "$change" != "A" || -n "${extra:-}" \
            || ! "$migration_path" =~ ^backend/migrations/[0-9]{4}_[A-Za-z0-9_]+\.sql$ ]]; then
            echo "::error::The migration ledger change must be one newly added four-digit SQL file."
            exit 1
          fi
          migration_prefix="$(basename "$migration_path" | cut -d_ -f1)"
          migration_version="$((10#$migration_prefix))"
          expected_previous_version="$((migration_version - 1))"
          migration_sha256="$(sha256sum "$migration_path" | awk '{print $1}')"
          {
            echo "target_sha=$TARGET_SHA"
            echo "migration_sha=$migration_sha"
            echo "migration_path=$migration_path"
            echo "migration_sha256=$migration_sha256"
            echo "migration_version=$migration_version"
            echo "expected_previous_version=$expected_previous_version"
          } >> "$GITHUB_OUTPUT"

      - name: Validate production recovery acknowledgement
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "apply-production" ]]; then
            [[ "$CONFIRM_PRODUCTION" == "true" ]] || {
              echo "::error::apply-production requires confirm_production."
              exit 1
            }
            if [[ ! "$BACKUP_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9_.:/-]{7,200}$ \
              || ! "$BACKUP_RESTORE_TEST_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9_.:/-]{7,200}$ ]]; then
              echo "::error::Opaque backup and restore-test references are required."
              exit 1
            fi
            if [[ "$BACKUP_REFERENCE" == *"://"* || "$BACKUP_RESTORE_TEST_REFERENCE" == *"://"* ]]; then
              echo "::error::Backup evidence must be an opaque provider ID, never a URL."
              exit 1
            fi
            backup_epoch="$(date -u -d "$BACKUP_VERIFIED_AT" +%s 2>/dev/null || true)"
            now_epoch="$(date -u +%s)"
            if [[ -z "$backup_epoch" || "$backup_epoch" -gt $((now_epoch + 300)) \
              || "$backup_epoch" -lt $((now_epoch - 86400)) ]]; then
              echo "::error::backup_verified_at must be valid RFC3339 within the last 24 hours."
              exit 1
            fi
          else
            if [[ "$CONFIRM_PRODUCTION" == "true" || -n "$BACKUP_REFERENCE" \
              || -n "$BACKUP_VERIFIED_AT" || -n "$BACKUP_RESTORE_TEST_REFERENCE" ]]; then
              echo "::error::Recovery acknowledgements are accepted only by apply-production."
              exit 1
            fi
          fi

      - name: Lint the derived additive migration
        env:
          MIGRATION_MODE: lint
          MIGRATION_PATH: ${{ steps.review.outputs.migration_path }}
          EXPECTED_MIGRATION_SHA256: ${{ steps.review.outputs.migration_sha256 }}
          EXPECTED_PREVIOUS_VERSION: ${{ steps.review.outputs.expected_previous_version }}
        run: scripts/verify-migration-ledger.sh

      - name: Summarize the reviewed migration
        run: |
          {
            echo "### Additive migration plan"
            echo "- **Operation:** \`${{ inputs.operation }}\`"
            echo "- **Revision:** \`${{ steps.review.outputs.target_sha }}\`"
            echo "- **Migration origin:** \`${{ steps.review.outputs.migration_sha }}\`"
            echo "- **Migration:** \`${{ steps.review.outputs.migration_path }}\`"
            echo "- **Version:** \`${{ steps.review.outputs.expected_previous_version }} -> ${{ steps.review.outputs.migration_version }}\`"
            echo "- **SHA-256:** \`${{ steps.review.outputs.migration_sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  database:
    name: ${{ inputs.operation }} additive expansion
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ contains(inputs.operation, 'production') && 'production' || 'v2-canary' }}
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ contains(inputs.operation, 'production') && 'production' || 'v2-canary' }}
      API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || (contains(inputs.operation, 'production') && 'epode-api' || 'agent-feedback-api') }}
      CANARY_API_SERVICE: ${{ vars.RAILWAY_CANARY_API_SERVICE || 'agent-feedback-api' }}
      DATABASE_SERVICE: ${{ vars.RAILWAY_DATABASE_SERVICE || 'Postgres' }}
      API_ORIGIN: ${{ contains(inputs.operation, 'production') && (vars.PRODUCTION_API_ORIGIN || 'https://api.epode.ai') || format('https://{0}', vars.V2_CANARY_API_DOMAIN) }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
      MIGRATION_PATH: ${{ needs.plan.outputs.migration_path }}
      EXPECTED_MIGRATION_SHA256: ${{ needs.plan.outputs.migration_sha256 }}
      EXPECTED_PREVIOUS_VERSION: ${{ needs.plan.outputs.expected_previous_version }}
      MIGRATION_VERSION: ${{ needs.plan.outputs.migration_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install pinned Railway CLI and PostgreSQL client
        run: |
          set -euo pipefail
          npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install pinned SQLx CLI for explicit apply
        if: startsWith(inputs.operation, 'apply')
        run: >-
          cargo install sqlx-cli
          --version "${SQLX_CLI_VERSION}"
          --locked
          --no-default-features
          --features rustls,postgres

      - name: Resolve the selected database without exposing its URL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          variables="$(railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$DATABASE_SERVICE" \
            --json)"
          database_url="$(jq -r '.DATABASE_PUBLIC_URL // empty' <<< "$variables")"
          if [[ ! "$database_url" =~ ^postgres(ql)?:// ]]; then
            echo "::error::$DATABASE_SERVICE has no externally reachable DATABASE_PUBLIC_URL."
            exit 1
          fi
          echo "::add-mask::$database_url"
          delimiter="db-url-$(openssl rand -hex 12)"
          {
            echo "DATABASE_URL<<$delimiter"
            echo "$database_url"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Read verified canary schema evidence
        id: canary
        if: inputs.operation == 'apply-production' || (inputs.operation == 'verify-production' && inputs.verification_state == 'after')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          variables="$(railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment v2-canary \
            --service "$CANARY_API_SERVICE" \
            --json)"
          jq -e \
            --arg revision "$TARGET_SHA" \
            --arg path "$MIGRATION_PATH" \
            --arg sha "$EXPECTED_MIGRATION_SHA256" \
            --arg version "$MIGRATION_VERSION" \
            '.EPODE_MIGRATION_STATUS == "verified"
              and .EPODE_MIGRATION_REVISION == $revision
              and .EPODE_MIGRATION_PATH == $path
              and .EPODE_MIGRATION_SHA256 == $sha
              and .EPODE_MIGRATION_VERSION == $version
              and (.EPODE_MIGRATION_SCHEMA_FINGERPRINT | test("^[0-9a-f]{64}$"))' \
            <<< "$variables" >/dev/null || {
              echo "::error::The exact migration has no verified canary schema evidence."
              exit 1
            }
          echo "schema_fingerprint=$(jq -r '.EPODE_MIGRATION_SCHEMA_FINGERPRINT' <<< "$variables")" >> "$GITHUB_OUTPUT"

      - name: Verify the selected ledger without mutation
        if: startsWith(inputs.operation, 'verify')
        env:
          MIGRATION_MODE: ${{ inputs.verification_state == 'before' && 'verify-before' || 'verify-after' }}
          EXPECTED_SCHEMA_FINGERPRINT: ${{ steps.canary.outputs.schema_fingerprint || '' }}
        run: scripts/verify-migration-ledger.sh

      - name: Capture the active application before expansion
        id: active
        if: startsWith(inputs.operation, 'apply')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          services="$(railway service list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --json)"
          count="$(jq --arg service "$API_SERVICE" '[.[] | select(.name == $service)] | length' <<< "$services")"
          [[ "$count" == "1" ]] || { echo "::error::Expected exactly one API service named $API_SERVICE."; exit 1; }
          deployment_id="$(jq -r --arg service "$API_SERVICE" 'first(.[] | select(.name == $service) | .deploymentId) // empty' <<< "$services")"
          deployments="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$API_SERVICE" --limit 100 --json)"
          image_ref="$(jq -r --arg id "$deployment_id" 'first(.[] | select(.id == $id) | .meta.image) // empty' <<< "$deployments")"
          image_digest="$(jq -r --arg id "$deployment_id" 'first(.[] | select(.id == $id) | .meta.imageDigest) // empty' <<< "$deployments")"
          status="$(jq -r --arg id "$deployment_id" 'first(.[] | select(.id == $id) | .status) // empty' <<< "$deployments")"
          if [[ "$status" != "SUCCESS" || ! "$image_ref" =~ ^ghcr\.io/open-software-network/os-epode-api:[0-9a-f]{7}$ \
            || ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The active API is not a successful immutable Epode image."
            exit 1
          fi
          {
            echo "ref=$image_ref"
            echo "digest=$image_digest"
            echo "deployment_id=$deployment_id"
          } >> "$GITHUB_OUTPUT"

      - name: Authorize the additive suffix and mark expansion pending
        if: startsWith(inputs.operation, 'apply')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          current_variables="$(railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$API_SERVICE" \
            --json)"
          current_max="$(jq -r '.EPODE_ADDITIVE_MIGRATION_MAX_VERSION // .EPODE_MIGRATION_BRIDGE_MAX_VERSION // "0"' <<< "$current_variables")"
          if [[ ! "$current_max" =~ ^[0-9]+$ || "$current_max" -gt "$MIGRATION_VERSION" ]]; then
            echo "::error::Refusing to lower or replace the current additive migration authorization."
            exit 1
          fi
          prefix="EPODE_MIGRATION"
          if [[ "${{ inputs.operation }}" == "apply-production" ]]; then
            prefix="EPODE_PRODUCTION_MIGRATION"
          fi
          railway variable set \
            "EPODE_ADDITIVE_MIGRATION_MAX_VERSION=$MIGRATION_VERSION" \
            "EPODE_MIGRATION_BRIDGE_MAX_VERSION=$MIGRATION_VERSION" \
            "${prefix}_STATUS=pending" \
            "${prefix}_REVISION=$TARGET_SHA" \
            "${prefix}_PATH=$MIGRATION_PATH" \
            "${prefix}_SHA256=$EXPECTED_MIGRATION_SHA256" \
            "${prefix}_VERSION=$MIGRATION_VERSION" \
            "${prefix}_SCHEMA_FINGERPRINT=pending" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$API_SERVICE" \
            --skip-deploys \
            --json >/dev/null

      - name: Apply the reviewed migration under advisory lock
        id: apply
        if: startsWith(inputs.operation, 'apply')
        env:
          MIGRATION_MODE: apply
          EXPECTED_SCHEMA_FINGERPRINT: ${{ steps.canary.outputs.schema_fingerprint || '' }}
        run: scripts/verify-migration-ledger.sh

      - name: Restart the same application against the expanded schema
        id: restart
        if: startsWith(inputs.operation, 'apply')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            "$RAILWAY_ENVIRONMENT" \
            "$API_SERVICE" \
            "${{ steps.active.outputs.ref }}" \
            "${{ steps.active.outputs.digest }}"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$API_ORIGIN/api/health" >/dev/null

      - name: Record verified canary expansion
        if: inputs.operation == 'apply-canary'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SCHEMA_FINGERPRINT: ${{ steps.apply.outputs.schema_fingerprint }}
        run: |
          set -euo pipefail
          railway variable set \
            "EPODE_MIGRATION_STATUS=verified" \
            "EPODE_MIGRATION_REVISION=$TARGET_SHA" \
            "EPODE_MIGRATION_PATH=$MIGRATION_PATH" \
            "EPODE_MIGRATION_SHA256=$EXPECTED_MIGRATION_SHA256" \
            "EPODE_MIGRATION_VERSION=$MIGRATION_VERSION" \
            "EPODE_MIGRATION_SCHEMA_FINGERPRINT=$SCHEMA_FINGERPRINT" \
            "EPODE_MIGRATION_API_REF=${{ steps.active.outputs.ref }}" \
            "EPODE_MIGRATION_API_DIGEST=${{ steps.active.outputs.digest }}" \
            "EPODE_MIGRATION_API_DEPLOYMENT_ID=${{ steps.restart.outputs.deployment_id }}" \
            "EPODE_MIGRATION_RUN_ID=${{ github.run_id }}" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment v2-canary \
            --service "$API_SERVICE" \
            --skip-deploys \
            --json >/dev/null
          variables="$(railway variable list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --service "$API_SERVICE" --json)"
          jq -e \
            --arg revision "$TARGET_SHA" \
            --arg path "$MIGRATION_PATH" \
            --arg sha "$EXPECTED_MIGRATION_SHA256" \
            --arg version "$MIGRATION_VERSION" \
            --arg fingerprint "$SCHEMA_FINGERPRINT" \
            --arg api_ref "${{ steps.active.outputs.ref }}" \
            --arg api_digest "${{ steps.active.outputs.digest }}" \
            --arg deployment_id "${{ steps.restart.outputs.deployment_id }}" \
            '.EPODE_MIGRATION_STATUS == "verified"
              and .EPODE_MIGRATION_REVISION == $revision
              and .EPODE_MIGRATION_PATH == $path
              and .EPODE_MIGRATION_SHA256 == $sha
              and .EPODE_MIGRATION_VERSION == $version
              and .EPODE_MIGRATION_SCHEMA_FINGERPRINT == $fingerprint
              and .EPODE_MIGRATION_API_REF == $api_ref
              and .EPODE_MIGRATION_API_DIGEST == $api_digest
              and .EPODE_MIGRATION_API_DEPLOYMENT_ID == $deployment_id' \
            <<< "$variables" >/dev/null

      - name: Record verified production expansion
        if: inputs.operation == 'apply-production'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SCHEMA_FINGERPRINT: ${{ steps.apply.outputs.schema_fingerprint }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          BACKUP_VERIFIED_AT: ${{ inputs.backup_verified_at }}
          BACKUP_RESTORE_TEST_REFERENCE: ${{ inputs.backup_restore_test_reference }}
        run: |
          set -euo pipefail
          railway variable set \
            "EPODE_PRODUCTION_MIGRATION_STATUS=verified" \
            "EPODE_PRODUCTION_MIGRATION_REVISION=$TARGET_SHA" \
            "EPODE_PRODUCTION_MIGRATION_PATH=$MIGRATION_PATH" \
            "EPODE_PRODUCTION_MIGRATION_SHA256=$EXPECTED_MIGRATION_SHA256" \
            "EPODE_PRODUCTION_MIGRATION_VERSION=$MIGRATION_VERSION" \
            "EPODE_PRODUCTION_MIGRATION_SCHEMA_FINGERPRINT=$SCHEMA_FINGERPRINT" \
            "EPODE_PRODUCTION_MIGRATION_API_REF=${{ steps.active.outputs.ref }}" \
            "EPODE_PRODUCTION_MIGRATION_API_DIGEST=${{ steps.active.outputs.digest }}" \
            "EPODE_PRODUCTION_MIGRATION_API_DEPLOYMENT_ID=${{ steps.restart.outputs.deployment_id }}" \
            "EPODE_PRODUCTION_MIGRATION_BACKUP_REFERENCE=$BACKUP_REFERENCE" \
            "EPODE_PRODUCTION_MIGRATION_BACKUP_VERIFIED_AT=$BACKUP_VERIFIED_AT" \
            "EPODE_PRODUCTION_MIGRATION_RESTORE_TEST_REFERENCE=$BACKUP_RESTORE_TEST_REFERENCE" \
            "EPODE_PRODUCTION_MIGRATION_RUN_ID=${{ github.run_id }}" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$API_SERVICE" \
            --skip-deploys \
            --json >/dev/null
          variables="$(railway variable list --project "$RAILWAY_PROJECT_ID" --environment production --service "$API_SERVICE" --json)"
          jq -e \
            --arg revision "$TARGET_SHA" \
            --arg path "$MIGRATION_PATH" \
            --arg sha "$EXPECTED_MIGRATION_SHA256" \
            --arg version "$MIGRATION_VERSION" \
            --arg fingerprint "$SCHEMA_FINGERPRINT" \
            --arg api_ref "${{ steps.active.outputs.ref }}" \
            --arg api_digest "${{ steps.active.outputs.digest }}" \
            --arg deployment_id "${{ steps.restart.outputs.deployment_id }}" \
            --arg backup "$BACKUP_REFERENCE" \
            --arg restore "$BACKUP_RESTORE_TEST_REFERENCE" \
            '.EPODE_PRODUCTION_MIGRATION_STATUS == "verified"
              and .EPODE_PRODUCTION_MIGRATION_REVISION == $revision
              and .EPODE_PRODUCTION_MIGRATION_PATH == $path
              and .EPODE_PRODUCTION_MIGRATION_SHA256 == $sha
              and .EPODE_PRODUCTION_MIGRATION_VERSION == $version
              and .EPODE_PRODUCTION_MIGRATION_SCHEMA_FINGERPRINT == $fingerprint
              and .EPODE_PRODUCTION_MIGRATION_API_REF == $api_ref
              and .EPODE_PRODUCTION_MIGRATION_API_DIGEST == $api_digest
              and .EPODE_PRODUCTION_MIGRATION_API_DEPLOYMENT_ID == $deployment_id
              and .EPODE_PRODUCTION_MIGRATION_BACKUP_REFERENCE == $backup
              and .EPODE_PRODUCTION_MIGRATION_RESTORE_TEST_REFERENCE == $restore' \
            <<< "$variables" >/dev/null

      - name: Summarize result
        env:
          IS_APPLY: ${{ startsWith(inputs.operation, 'apply') }}
        run: |
          {
            echo "### Additive migration result"
            echo "- **Environment:** \`$RAILWAY_ENVIRONMENT\`"
            echo "- **Operation:** \`${{ inputs.operation }}\`"
            echo "- **Migration:** \`$MIGRATION_PATH\`"
            if [[ "$IS_APPLY" == "true" ]]; then
              echo "- **Application restarted:** \`${{ steps.active.outputs.ref }}@${{ steps.active.outputs.digest }}\`"
              echo "- **Backup evidence:** \`${{ inputs.operation == 'apply-production' && inputs.backup_reference || 'not required' }}\`"
            else
              echo "- **Database mutation:** none"
              echo "- **Railway mutation:** none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
