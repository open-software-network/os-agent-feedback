name: Promote or rollback production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Promote reviewed artifacts or roll back to previously deployed SHA tags.
        required: true
        default: promote
        type: choice
        options:
          - promote
          - rollback
      api_sha:
        description: API image commit SHA (7-40 lowercase hexadecimal characters).
        required: true
        type: string
      web_sha:
        description: Web image commit SHA (7-40 lowercase hexadecimal characters).
        required: true
        type: string
      confirm_rollback:
        description: Required acknowledgement when operation is rollback.
        required: false
        default: false
        type: boolean
      rollback_reason:
        description: Required operator-visible reason when operation is rollback.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: epode-release-mutation
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RAILWAY_CLI_VERSION: 5.30.1

jobs:
  plan:
    name: Resolve complete production pair
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      api_ref: ${{ steps.resolve.outputs.api_ref }}
      api_digest: ${{ steps.resolve.outputs.api_digest }}
      api_revision: ${{ steps.resolve.outputs.api_revision }}
      web_ref: ${{ steps.resolve.outputs.web_ref }}
      web_digest: ${{ steps.resolve.outputs.web_digest }}
      web_revision: ${{ steps.resolve.outputs.web_revision }}
    env:
      OPERATION: ${{ inputs.operation }}
      API_SHA: ${{ inputs.api_sha }}
      WEB_SHA: ${{ inputs.web_sha }}
      CONFIRM_ROLLBACK: ${{ inputs.confirm_rollback }}
      ROLLBACK_REASON: ${{ inputs.rollback_reason }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate operation inputs
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Production promotion and rollback workflows must run from protected ${DEFAULT_BRANCH}."
            exit 1
          fi
          if [[ "$OPERATION" == "rollback" ]]; then
            if [[ "$CONFIRM_ROLLBACK" != "true" ]]; then
              echo "::error::A rollback requires confirm_rollback."
              exit 1
            fi
            if [[ -z "${ROLLBACK_REASON//[[:space:]]/}" ]]; then
              echo "::error::A rollback requires rollback_reason for the audit summary."
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve both sides before the production approval and before any
      # Railway mutation. There is deliberately no artifact=all matrix: this
      # workflow has one explicit pair and applies it API-first, then web.
      - name: Resolve API and web SHA tags
        id: resolve
        run: |
          set -euo pipefail
          for artifact in api web; do
            if [[ "$artifact" == "api" ]]; then
              requested_sha="$API_SHA"
            else
              requested_sha="$WEB_SHA"
            fi
            if [[ ! "$requested_sha" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::${artifact}_sha must be a 7-40 character lowercase hexadecimal commit SHA."
              exit 1
            fi

            sha_short="${requested_sha:0:7}"
            image="${REGISTRY}/open-software-network/os-epode-${artifact}"
            ref="${image}:${sha_short}"
            if ! docker buildx imagetools inspect "$ref" --raw >/dev/null 2>&1; then
              echo "::error::Required image $ref does not exist."
              exit 1
            fi

            digest="$(
              docker buildx imagetools inspect "$ref" \
                --format '{{ json .Manifest }}' | jq -r '.digest // empty'
            )"
            revision="$(
              docker buildx imagetools inspect "$ref" \
                --format '{{ json .Image }}' \
                | jq -r 'first(.. | objects | select(.config?.Labels?["org.opencontainers.image.revision"] != null) | .config.Labels["org.opencontainers.image.revision"]) // empty'
            )"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve an immutable digest for $ref."
              exit 1
            fi
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ || "${revision:0:${#requested_sha}}" != "$requested_sha" ]]; then
              echo "::error::$ref was built from ${revision:-an unknown revision}, not $requested_sha."
              exit 1
            fi

            {
              echo "${artifact}_ref=$ref"
              echo "${artifact}_digest=$digest"
              echo "${artifact}_revision=$revision"
            } >>"$GITHUB_OUTPUT"
            {
              echo "### ${artifact^^} ${OPERATION} target"
              echo "- **SHA tag:** \`$ref\`"
              echo "- **Digest:** \`$digest\`"
              echo "- **Revision:** \`$revision\`"
            } >>"$GITHUB_STEP_SUMMARY"
            printf -v "${artifact}_resolved_revision" '%s' "$revision"
          done

          if [[ "$api_resolved_revision" != "$web_resolved_revision" ]]; then
            echo "::error::Production changes require API and web images from one reviewed commit."
            exit 1
          fi
          revision="$api_resolved_revision"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$revision" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Production revision $revision is not an ancestor of protected $DEFAULT_BRANCH."
            exit 1
          fi
          ci_conclusion="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${revision}&status=completed&per_page=20" \
              --jq '.workflow_runs | map(select(.head_branch == env.DEFAULT_BRANCH and .event == "push")) | max_by(.run_number, .run_attempt) | .conclusion // empty'
          )"
          if [[ "$ci_conclusion" != "success" ]]; then
            echo "::error::The exact production revision $revision has no successful completed CI workflow."
            exit 1
          fi

      - name: Preserve every previously published hosted artifact
        env:
          API_REF: ${{ steps.resolve.outputs.api_ref }}
          API_DIGEST: ${{ steps.resolve.outputs.api_digest }}
        run: bash scripts/verify-image-artifact-ledger.sh "${API_REF}@${API_DIGEST}"

  deploy:
    name: ${{ inputs.operation == 'rollback' && 'Rollback' || 'Promote' }} API then web
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || 'epode-api' }}
      WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || 'epode-web' }}
      API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN || 'https://api.epode.ai' }}
      WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN || 'https://app.epode.ai' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Validate production routing configuration
        id: routing
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$API_ORIGIN" =~ ^https://[^/]+$ || ! "$WEB_ORIGIN" =~ ^https://[^/]+$ ]]; then
            echo "::error::Production origins must be origin-only HTTPS URLs without a trailing slash."
            exit 1
          fi
          api_variables="$(railway variables --project "$RAILWAY_PROJECT_ID" --environment production --service "$API_SERVICE" --json)"
          web_variables="$(railway variables --project "$RAILWAY_PROJECT_ID" --environment production --service "$WEB_SERVICE" --json)"
          jq -e --arg web "$WEB_ORIGIN" \
            '.PUBLIC_BASE_URL == $web and .WEB_APP_URL == $web' <<<"$api_variables" >/dev/null || {
            echo "::error::$API_SERVICE must use the public web origin for PUBLIC_BASE_URL and WEB_APP_URL."
            exit 1
          }
          jq -e --arg api "$API_ORIGIN" '.API_URL == $api' <<<"$web_variables" >/dev/null || {
            echo "::error::$WEB_SERVICE API_URL does not match the reviewed production API origin."
            exit 1
          }
          accounts_url="$(jq -r '.OS_ACCOUNTS_URL // empty' <<<"$api_variables")"
          if [[ ! "$accounts_url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "::error::$API_SERVICE has no valid OS_ACCOUNTS_URL."
            exit 1
          fi
          echo "accounts_url=${accounts_url%/}" >>"$GITHUB_OUTPUT"

      - name: Verify the exact promotion pair passed canary
        if: inputs.operation == 'promote'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_CANARY_TOKEN }}
          EXPECTED_API_REF: ${{ needs.plan.outputs.api_ref }}
          EXPECTED_API_DIGEST: ${{ needs.plan.outputs.api_digest }}
          EXPECTED_REVISION: ${{ needs.plan.outputs.api_revision }}
          EXPECTED_WEB_REF: ${{ needs.plan.outputs.web_ref }}
          EXPECTED_WEB_DIGEST: ${{ needs.plan.outputs.web_digest }}
        run: |
          set -euo pipefail
          services="$(railway service list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --json)"
          attestation="$(railway variable list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --service "$API_SERVICE" --json)"
          attested_api_deployment_id="$(jq -r '.EPODE_CANARY_API_DEPLOYMENT_ID // empty' <<<"$attestation")"
          attested_web_deployment_id="$(jq -r '.EPODE_CANARY_WEB_DEPLOYMENT_ID // empty' <<<"$attestation")"
          jq -e \
            --arg api_ref "$EXPECTED_API_REF" \
            --arg api_digest "$EXPECTED_API_DIGEST" \
            --arg revision "$EXPECTED_REVISION" \
            --arg web_ref "$EXPECTED_WEB_REF" \
            --arg web_digest "$EXPECTED_WEB_DIGEST" \
            '.EPODE_CANARY_STATUS == "verified"
              and (.EPODE_CANARY_RUN_ID | type == "string" and length > 0)
              and (.EPODE_CANARY_RUN_ATTEMPT | type == "string" and length > 0)
              and (.EPODE_CANARY_API_DEPLOYMENT_ID | type == "string" and length > 0)
              and (.EPODE_CANARY_WEB_DEPLOYMENT_ID | type == "string" and length > 0)
              and .EPODE_CANARY_API_REF == $api_ref
              and .EPODE_CANARY_API_DIGEST == $api_digest
              and .EPODE_CANARY_REVISION == $revision
              and .EPODE_CANARY_WEB_REF == $web_ref
              and .EPODE_CANARY_WEB_DIGEST == $web_digest' \
            <<<"$attestation" >/dev/null || {
            echo "::error::The requested API/web pair has no matching successful v2-canary attestation."
            exit 1
          }

          for artifact in api web; do
            if [[ "$artifact" == "api" ]]; then
              service="$API_SERVICE"
              expected_ref="$EXPECTED_API_REF"
              expected_digest="$EXPECTED_API_DIGEST"
              attested_deployment_id="$attested_api_deployment_id"
            else
              service="$WEB_SERVICE"
              expected_ref="$EXPECTED_WEB_REF"
              expected_digest="$EXPECTED_WEB_DIGEST"
              attested_deployment_id="$attested_web_deployment_id"
            fi
            count="$(jq --arg service "$service" '[.[] | select(.name == $service)] | length' <<<"$services")"
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Expected exactly one v2-canary service named $service; found $count."
              exit 1
            fi
            active_id="$(jq -r --arg service "$service" 'first(.[] | select(.name == $service) | .deploymentId) // empty' <<<"$services")"
            deployments="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --service "$service" --limit 100 --json)"
            active_ref="$(jq -r --arg id "$active_id" 'first(.[] | select(.id == $id) | .meta.image) // empty' <<<"$deployments")"
            active_digest="$(jq -r --arg id "$active_id" 'first(.[] | select(.id == $id) | .meta.imageDigest) // empty' <<<"$deployments")"
            active_status="$(jq -r --arg id "$active_id" 'first(.[] | select(.id == $id) | .status) // empty' <<<"$deployments")"
            if [[ "$active_id" != "$attested_deployment_id" || "$active_status" != "SUCCESS" || "$active_ref" != "$expected_ref" || "$active_digest" != "$expected_digest" ]]; then
              echo "::error::Active v2-canary $service does not match the requested, attested image."
              exit 1
            fi
          done

      - name: Capture recoverable production state
        id: previous
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RAILWAY_TOKEN" || -z "$RAILWAY_PROJECT_ID" ]]; then
            echo "::error::The production RAILWAY_TOKEN secret and RAILWAY_PROJECT_ID variable are required."
            exit 1
          fi

          services="$(railway service list --project "$RAILWAY_PROJECT_ID" --environment production --json)"
          for artifact in api web; do
            if [[ "$artifact" == "api" ]]; then
              service="$API_SERVICE"
            else
              service="$WEB_SERVICE"
            fi
            count="$(jq --arg service "$service" '[.[] | select(.name == $service)] | length' <<<"$services")"
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Expected exactly one production service named $service; found $count."
              exit 1
            fi
            active_id="$(jq -r --arg service "$service" 'first(.[] | select(.name == $service) | .deploymentId) // empty' <<<"$services")"
            if [[ -z "$active_id" ]]; then
              echo "::error::$service has no active deployment to restore if the paired change fails."
              exit 1
            fi
            deployments="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --environment production --service "$service" --limit 100 --json)"
            previous_ref="$(jq -r --arg id "$active_id" 'first(.[] | select(.id == $id) | .meta.image) // empty' <<<"$deployments")"
            previous_digest="$(jq -r --arg id "$active_id" 'first(.[] | select(.id == $id) | .meta.imageDigest) // empty' <<<"$deployments")"
            expected_image="ghcr.io/open-software-network/os-epode-${artifact}"
            previous_tag="${previous_ref#"${expected_image}:"}"
            if [[ "$previous_tag" == "$previous_ref" || ! "$previous_tag" =~ ^[0-9a-f]{7}$ ]]; then
              echo "::error::Active $service image $previous_ref is not a recoverable immutable Epode SHA tag."
              exit 1
            fi
            if [[ ! "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Active $service deployment $active_id has no recoverable imageDigest."
              exit 1
            fi
            registry_digest="$(
              docker buildx imagetools inspect "$previous_ref" \
                --format '{{ json .Manifest }}' | jq -r '.digest // empty'
            )"
            if [[ "$registry_digest" != "$previous_digest" ]]; then
              echo "::error::Cannot safely restore $service: $previous_ref now resolves to ${registry_digest:-no digest}, not active digest $previous_digest."
              exit 1
            fi
            production_ref="${expected_image}:production"
            production_digest="$(
              docker buildx imagetools inspect "$production_ref" \
                --format '{{ json .Manifest }}' | jq -r '.digest // empty'
            )"
            if [[ "$production_digest" != "$previous_digest" ]]; then
              echo "::error::$production_ref must identify the active, recoverable $service digest before a paired change."
              exit 1
            fi
            {
              echo "${artifact}_ref=$previous_ref"
              echo "${artifact}_digest=$previous_digest"
            } >>"$GITHUB_OUTPUT"
          done

      - name: Promote API
        id: promote_api
        if: inputs.operation == 'promote'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$API_SERVICE" \
            "${{ needs.plan.outputs.api_ref }}" \
            "${{ needs.plan.outputs.api_digest }}"

      - name: Roll back API
        id: rollback_api
        if: inputs.operation == 'rollback'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$API_SERVICE" \
            "${{ needs.plan.outputs.api_ref }}" \
            "${{ needs.plan.outputs.api_digest }}"

      - name: Promote web
        id: promote_web
        if: inputs.operation == 'promote' && steps.promote_api.outcome == 'success'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$WEB_SERVICE" \
            "${{ needs.plan.outputs.web_ref }}" \
            "${{ needs.plan.outputs.web_digest }}"

      - name: Roll back web
        id: rollback_web
        if: inputs.operation == 'rollback' && steps.rollback_api.outcome == 'success'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$WEB_SERVICE" \
            "${{ needs.plan.outputs.web_ref }}" \
            "${{ needs.plan.outputs.web_digest }}"

      - name: Restore API after an incomplete paired change
        id: restore_api_after_change
        if: >-
          always() && (
            (inputs.operation == 'promote' && (steps.promote_api.outcome == 'failure' || steps.promote_web.outcome == 'failure')) ||
            (inputs.operation == 'rollback' && (steps.rollback_api.outcome == 'failure' || steps.rollback_web.outcome == 'failure'))
          )
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$API_SERVICE" \
            "${{ steps.previous.outputs.api_ref }}" \
            "${{ steps.previous.outputs.api_digest }}"

      - name: Restore web after a failed web change
        id: restore_web_after_change
        if: >-
          always() && (
            (inputs.operation == 'promote' && steps.promote_web.outcome == 'failure') ||
            (inputs.operation == 'rollback' && steps.rollback_web.outcome == 'failure')
          )
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$WEB_SERVICE" \
            "${{ steps.previous.outputs.web_ref }}" \
            "${{ steps.previous.outputs.web_digest }}"

      - name: Fail an incomplete paired change
        if: >-
          always() && (
            (inputs.operation == 'promote' && (steps.promote_api.outcome == 'failure' || steps.promote_web.outcome == 'failure')) ||
            (inputs.operation == 'rollback' && (steps.rollback_api.outcome == 'failure' || steps.rollback_web.outcome == 'failure'))
          )
        run: |
          if [[ "${{ steps.restore_api_after_change.outcome }}" != "success" || ("${{ steps.restore_web_after_change.outcome }}" != "success" && "${{ steps.restore_web_after_change.outcome }}" != "skipped") ]]; then
            echo "::error::The paired change failed and at least one independent restoration also failed. Immediate operator intervention is required."
          else
            echo "::error::The paired change failed. Every service that could have changed was restored independently; production tags were not moved."
          fi
          exit 1

      - name: Verify production HTTP and authentication start
        id: production_smoke
        continue-on-error: true
        env:
          ACCOUNTS_URL: ${{ steps.routing.outputs.accounts_url }}
        run: |
          set -euo pipefail
          api_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$API_ORIGIN/api/health")"
          if [[ "$api_status" != "200" ]]; then
            echo "::error::$API_ORIGIN/api/health returned HTTP $api_status instead of 200."
            exit 1
          fi
          bash scripts/verify-public-integration-surface.sh "$WEB_ORIGIN" "$ACCOUNTS_URL"

      - name: Restore the previous API after a failed production smoke
        id: restore_api_after_smoke
        if: always() && steps.production_smoke.outcome == 'failure'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$API_SERVICE" \
            "${{ steps.previous.outputs.api_ref }}" \
            "${{ steps.previous.outputs.api_digest }}"

      - name: Restore the previous web after a failed production smoke
        id: restore_web_after_smoke
        if: always() && steps.production_smoke.outcome == 'failure'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$WEB_SERVICE" \
            "${{ steps.previous.outputs.web_ref }}" \
            "${{ steps.previous.outputs.web_digest }}"

      - name: Fail a production smoke that required restoration
        if: always() && steps.production_smoke.outcome == 'failure'
        run: |
          if [[ "${{ steps.restore_api_after_smoke.outcome }}" != "success" || "${{ steps.restore_web_after_smoke.outcome }}" != "success" ]]; then
            echo "::error::Production smoke failed and at least one independent restoration failed. Immediate operator intervention is required."
          else
            echo "::error::Production smoke failed. The previous API and web pair were independently restored; production tags were not moved."
          fi
          exit 1

      - name: Move API production tag after both services succeed
        id: tag_api
        if: steps.production_smoke.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/open-software-network/os-epode-api:production" \
            "${REGISTRY}/open-software-network/os-epode-api@${{ needs.plan.outputs.api_digest }}"

      - name: Move web production tag after the API tag succeeds
        id: tag_web
        if: steps.production_smoke.outcome == 'success' && steps.tag_api.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/open-software-network/os-epode-web:production" \
            "${REGISTRY}/open-software-network/os-epode-web@${{ needs.plan.outputs.web_digest }}"

      - name: Verify both production tags by digest
        id: tag_readback
        if: steps.tag_api.outcome == 'success' && steps.tag_web.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for artifact in api web; do
            if [[ "$artifact" == "api" ]]; then
              expected_digest="${{ needs.plan.outputs.api_digest }}"
            else
              expected_digest="${{ needs.plan.outputs.web_digest }}"
            fi
            production_ref="${REGISTRY}/open-software-network/os-epode-${artifact}:production"
            actual_digest="$(
              docker buildx imagetools inspect "$production_ref" \
                --format '{{ json .Manifest }}' | jq -r '.digest // empty'
            )"
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "::error::$production_ref resolved to ${actual_digest:-no digest}, not $expected_digest."
              exit 1
            fi
          done

      - name: Restore API production tag after incomplete tag movement
        id: restore_api_tag
        if: >-
          always() && steps.production_smoke.outcome == 'success' && (
            steps.tag_api.outcome != 'success' || steps.tag_web.outcome != 'success' || steps.tag_readback.outcome != 'success'
          )
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/open-software-network/os-epode-api:production" \
            "${REGISTRY}/open-software-network/os-epode-api@${{ steps.previous.outputs.api_digest }}"

      - name: Restore web production tag after incomplete tag movement
        id: restore_web_tag
        if: >-
          always() && steps.production_smoke.outcome == 'success' && (
            steps.tag_api.outcome != 'success' || steps.tag_web.outcome != 'success' || steps.tag_readback.outcome != 'success'
          )
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/open-software-network/os-epode-web:production" \
            "${REGISTRY}/open-software-network/os-epode-web@${{ steps.previous.outputs.web_digest }}"

      - name: Restore API service after incomplete tag movement
        id: restore_api_after_tags
        if: >-
          always() && steps.production_smoke.outcome == 'success' && (
            steps.tag_api.outcome != 'success' || steps.tag_web.outcome != 'success' || steps.tag_readback.outcome != 'success'
          )
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$API_SERVICE" \
            "${{ steps.previous.outputs.api_ref }}" \
            "${{ steps.previous.outputs.api_digest }}"

      - name: Restore web service after incomplete tag movement
        id: restore_web_after_tags
        if: >-
          always() && steps.production_smoke.outcome == 'success' && (
            steps.tag_api.outcome != 'success' || steps.tag_web.outcome != 'success' || steps.tag_readback.outcome != 'success'
          )
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            production \
            "$WEB_SERVICE" \
            "${{ steps.previous.outputs.web_ref }}" \
            "${{ steps.previous.outputs.web_digest }}"

      - name: Fail incomplete production tag movement
        if: >-
          always() && steps.production_smoke.outcome == 'success' && (
            steps.tag_api.outcome != 'success' || steps.tag_web.outcome != 'success' || steps.tag_readback.outcome != 'success'
          )
        run: |
          if [[ "${{ steps.restore_api_tag.outcome }}" != "success" \
            || "${{ steps.restore_web_tag.outcome }}" != "success" \
            || "${{ steps.restore_api_after_tags.outcome }}" != "success" \
            || "${{ steps.restore_web_after_tags.outcome }}" != "success" ]]; then
            echo "::error::Production tag movement failed and at least one independent tag or service restoration failed. Immediate operator intervention is required."
          else
            echo "::error::Production tag movement failed. The prior service pair and both production tags were restored."
          fi
          exit 1

      - name: Summarize production change
        if: steps.tag_readback.outcome == 'success'
        env:
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        run: |
          {
            echo "### Production ${OPERATION} completed"
            echo "- **API:** \`${{ needs.plan.outputs.api_ref }}@${{ needs.plan.outputs.api_digest }}\`"
            echo "- **Web:** \`${{ needs.plan.outputs.web_ref }}@${{ needs.plan.outputs.web_digest }}\`"
            if [[ "$OPERATION" == "rollback" ]]; then
              echo "- **Reason:** ${ROLLBACK_REASON}"
              echo "- **Database:** unchanged; Railway image rollback does not reverse SQL migrations."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
