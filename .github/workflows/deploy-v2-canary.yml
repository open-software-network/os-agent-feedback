name: Deploy v2 canary

on:
  workflow_dispatch:
    inputs:
      api_sha:
        description: API image commit SHA (7-40 lowercase hexadecimal characters).
        required: true
        type: string
      web_sha:
        description: Web image commit SHA (7-40 lowercase hexadecimal characters).
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-v2-canary
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RAILWAY_CLI_VERSION: 5.30.1

jobs:
  plan:
    name: Resolve immutable images
    runs-on: ubuntu-latest
    outputs:
      api_ref: ${{ steps.resolve.outputs.api_ref }}
      api_digest: ${{ steps.resolve.outputs.api_digest }}
      api_revision: ${{ steps.resolve.outputs.api_revision }}
      web_ref: ${{ steps.resolve.outputs.web_ref }}
      web_digest: ${{ steps.resolve.outputs.web_digest }}
      web_revision: ${{ steps.resolve.outputs.web_revision }}
    env:
      API_SHA: ${{ inputs.api_sha }}
      WEB_SHA: ${{ inputs.web_sha }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and cross-check API and web images
        id: resolve
        run: |
          set -euo pipefail
          for artifact in api web; do
            if [[ "$artifact" == "api" ]]; then
              requested_sha="$API_SHA"
            else
              requested_sha="$WEB_SHA"
            fi
            if [[ ! "$requested_sha" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::${artifact}_sha must be a 7-40 character lowercase hexadecimal commit SHA."
              exit 1
            fi

            sha_short="${requested_sha:0:7}"
            image="${REGISTRY}/open-software-network/os-epode-${artifact}"
            ref="${image}:${sha_short}"
            if ! docker buildx imagetools inspect "$ref" --raw >/dev/null 2>&1; then
              echo "::error::Required image $ref does not exist. Build both images before canary deployment."
              exit 1
            fi

            digest="$(
              docker buildx imagetools inspect "$ref" \
                --format '{{ json .Manifest }}' | jq -r '.digest // empty'
            )"
            revision="$(
              docker buildx imagetools inspect "$ref" \
                --format '{{ json .Image }}' \
                | jq -r 'first(.. | objects | select(.config?.Labels?["org.opencontainers.image.revision"] != null) | .config.Labels["org.opencontainers.image.revision"]) // empty'
            )"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve an immutable digest for $ref."
              exit 1
            fi
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ || "${revision:0:${#requested_sha}}" != "$requested_sha" ]]; then
              echo "::error::$ref was built from ${revision:-an unknown revision}, not $requested_sha."
              exit 1
            fi

            {
              echo "${artifact}_ref=$ref"
              echo "${artifact}_digest=$digest"
              echo "${artifact}_revision=$revision"
            } >>"$GITHUB_OUTPUT"
            {
              echo "### ${artifact^^} canary image"
              echo "- **Tag:** \`$ref\`"
              echo "- **Digest:** \`$digest\`"
              echo "- **Revision:** \`$revision\`"
            } >>"$GITHUB_STEP_SUMMARY"
          done

  deploy:
    name: Deploy API then web
    needs: plan
    runs-on: ubuntu-latest
    environment: v2-canary
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || 'epode-api' }}
      WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || 'epode-web' }}
      API_DOMAIN: ${{ vars.V2_CANARY_API_DOMAIN }}
      WEB_DOMAIN: ${{ vars.V2_CANARY_WEB_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Validate services and domains; provision public variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RAILWAY_TOKEN" || -z "$RAILWAY_PROJECT_ID" ]]; then
            echo "::error::The v2-canary RAILWAY_TOKEN secret and RAILWAY_PROJECT_ID variable are required."
            exit 1
          fi
          for pair in "API_DOMAIN=$API_DOMAIN" "WEB_DOMAIN=$WEB_DOMAIN"; do
            name="${pair%%=*}"
            domain="${pair#*=}"
            if [[ ! "$domain" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
              echo "::error::$name must be a hostname without a scheme or path."
              exit 1
            fi
          done

          services="$(railway service list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --json)"
          for service in "$API_SERVICE" "$WEB_SERVICE"; do
            count="$(jq --arg service "$service" '[.[] | select(.name == $service)] | length' <<<"$services")"
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Expected exactly one service named $service in v2-canary; found $count."
              exit 1
            fi
          done

          for spec in "$API_SERVICE=$API_DOMAIN" "$WEB_SERVICE=$WEB_DOMAIN"; do
            service="${spec%%=*}"
            expected_domain="${spec#*=}"
            domains="$(railway domain list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --service "$service" --json)"
            if ! jq -e --arg domain "$expected_domain" '.domains | any(.domain == $domain)' <<<"$domains" >/dev/null; then
              echo "::error::$service does not own configured domain $expected_domain in v2-canary."
              exit 1
            fi
          done

          # The API cannot boot without these pre-provisioned or referenced
          # values. Only key presence is tested so sealed secrets stay opaque.
          api_variables="$(railway variable list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --service "$API_SERVICE" --json)"
          for key in DATABASE_URL OS_ACCOUNTS_URL OS_ACCOUNTS_API_URL OS_ACCOUNTS_CLIENT_ID; do
            if ! jq -e --arg key "$key" 'has($key)' <<<"$api_variables" >/dev/null; then
              echo "::error::$API_SERVICE is missing required v2-canary variable $key."
              exit 1
            fi
          done

          # These values are public, repository-owned routing configuration.
          # Stage them without an extra deployment; the image deployment below
          # applies the values once together with the reviewed artifact.
          railway variable set \
            "PUBLIC_BASE_URL=https://${API_DOMAIN}" \
            "WEB_APP_URL=https://${WEB_DOMAIN}" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment v2-canary \
            --service "$API_SERVICE" \
            --skip-deploys \
            --json >/dev/null
          railway variable set \
            "API_URL=https://${API_DOMAIN}" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment v2-canary \
            --service "$WEB_SERVICE" \
            --skip-deploys \
            --json >/dev/null

          api_variables="$(railway variable list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --service "$API_SERVICE" --json)"
          web_variables="$(railway variable list --project "$RAILWAY_PROJECT_ID" --environment v2-canary --service "$WEB_SERVICE" --json)"
          jq -e --arg public_url "https://${API_DOMAIN}" --arg web_url "https://${WEB_DOMAIN}" \
            '.PUBLIC_BASE_URL == $public_url and .WEB_APP_URL == $web_url' <<<"$api_variables" >/dev/null
          jq -e --arg api_url "https://${API_DOMAIN}" '.API_URL == $api_url' <<<"$web_variables" >/dev/null

      - name: Deploy and verify API image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            v2-canary \
            "$API_SERVICE" \
            "${{ needs.plan.outputs.api_ref }}" \
            "${{ needs.plan.outputs.api_digest }}"

      - name: Verify API health
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${API_DOMAIN}/api/health" >/dev/null

      - name: Deploy and verify web image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway-deploy-image.sh \
            v2-canary \
            "$WEB_SERVICE" \
            "${{ needs.plan.outputs.web_ref }}" \
            "${{ needs.plan.outputs.web_digest }}"

      - name: Verify web health
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${WEB_DOMAIN}/" >/dev/null

      - name: Summarize verified canary
        run: |
          {
            echo "### v2 canary deployed"
            echo "- **API revision:** \`${{ needs.plan.outputs.api_revision }}\`"
            echo "- **Web revision:** \`${{ needs.plan.outputs.web_revision }}\`"
            echo "- **API:** \`${{ needs.plan.outputs.api_ref }}@${{ needs.plan.outputs.api_digest }}\`"
            echo "- **Web:** \`${{ needs.plan.outputs.web_ref }}@${{ needs.plan.outputs.web_digest }}\`"
            echo "- **API URL:** https://${API_DOMAIN}"
            echo "- **Web URL:** https://${WEB_DOMAIN}"
          } >>"$GITHUB_STEP_SUMMARY"
