name: Build Node examples

on:
  push:
    branches: [main]
    paths:
      - "backend/public/agent-feedback-node-*.tgz"
      - "sdk/node/**"
      - "examples/node-express/**"
      - "examples/node-mcp/**"
      - ".dockerignore"
      - ".github/workflows/build-node-examples.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-node-examples-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: node-express
            image: os-epode-example-node-express
          - example: node-mcp
            image: os-epode-example-node-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image metadata
        id: meta
        run: echo "created=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./examples/${{ matrix.example }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/open-software-network/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/open-software-network/${{ matrix.image }}:staging
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summarize image
        env:
          IMAGE: ${{ env.REGISTRY }}/open-software-network/${{ matrix.image }}
        run: |
          {
            echo "### ${IMAGE} built"
            echo "- **Commit tag:** \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- **Staging tag:** \`${IMAGE}:staging\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
